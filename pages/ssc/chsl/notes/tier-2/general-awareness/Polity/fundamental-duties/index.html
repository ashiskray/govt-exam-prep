<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Polity | Govt Exam Prep</title>

    <link rel="stylesheet" href="/pages/ssc/chsl/notes/tier-2/general-awareness/Polity/constitution/style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>



<!-- ================= NAVBAR ================= -->

<nav class="navbar">
       <div class="logo">

       <img src="/assets/images/logo.png">

       <div>

       <h2>Govt Exam Prep</h2>

       <small>Ebook Reader</small>

       </div>

       </div>
     


    <div class="nav-right">
         

        <button class="icon-btn" id="theme-btn">
           🌙
        </button>

        <button class="icon-btn" id="fullscreen-btn">

           ⛶

        </button>

    </div>

</nav>



<!-- ================= BOOK INFO ================= -->

<section class="book-header">

    <div>

        <h1>

              Fundamental Duties

        </h1>

        <p>

            Complete Study Notes

        </p>

    </div>

</section>



<!-- ================= PROGRESS ================= -->

<section class="progress-section">

    <div class="progress-top">

        <span>

            Reading Progress

        </span>

        <span id="progressText">

            0%

        </span>

    </div>



    <div class="progress-bar">

        <div id="progress"></div>

    </div>

</section>



<!-- ================= PDF VIEWER ================= -->

<main class="viewer-area">

    <div class="pdf-card">

        <canvas id="pdf-render"></canvas>

    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="reader-footer">

    <div class="page-box">

        <span>

            📄 Page

        </span>

        <strong>

            <span id="page-num">1</span>

            /

            <span id="page-count">0</span>

        </strong>

    </div>



    <div class="navigation">

        <button id="prev-page"
                class="nav-btn">

            ◀ Previous

        </button>



        <button id="next-page"
                class="nav-btn primary">

            Next ▶

        </button>

    </div>

</footer>



<script src="script.js"></script>

</body>
</html>
