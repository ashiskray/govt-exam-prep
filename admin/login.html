<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Govt Exam Prep</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #800000;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #800000;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #800000;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #650000;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #800000;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <h1>🔐 GOVT EXAM PREP</h1>
                <p>Administrator Login</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter admin username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter admin password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login to Admin Panel
                </button>

                <div id="message" class="message"></div>

            </form>

            <a href="../index.html" class="back-home">
                ← Back to Website
            </a>

        </div>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            message.textContent = "Logging in...";

            try {

                const response = await fetch(
                    "http://localhost:5000/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    message.textContent = "Login successful ✅";

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 500);

                } else {

                    message.textContent = data.message || "Login failed ❌";

                }

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to backend ❌";

            }

        });

    </script>

</body>

</html>
