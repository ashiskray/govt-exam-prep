<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests Coming Soon</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="construction-section">

        <!-- Background workers -->
        <div class="workers-bg">

            <div class="worker worker-one">
                <i class="fa-solid fa-person-digging"></i>
            </div>

            <div class="worker worker-two">
                <i class="fa-solid fa-person"></i>
            </div>

            <div class="worker worker-three">
                <i class="fa-solid fa-person-digging"></i>
            </div>

            <div class="worker worker-four">
                <i class="fa-solid fa-person"></i>
            </div>

            <!-- Construction elements -->
            <div class="construction-icon icon-one">
                <i class="fa-solid fa-helmet-safety"></i>
            </div>

            <div class="construction-icon icon-two">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <div class="construction-icon icon-three">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>

        </div>

        <!-- Dark overlay -->
        <div class="overlay"></div>

        <!-- Main content -->
        <div class="coming-content">

            <div class="status-badge">
                <span class="pulse"></span>
                WORK IN PROGRESS
            </div>

            <div class="main-icon">
                <i class="fa-solid fa-person-digging"></i>
            </div>

            <h1>
                MOCK TESTS
                <span>ARE COMING SOON</span>
            </h1>

            <div class="date-box">
                <i class="fa-regular fa-calendar-check"></i>
                <strong>Before 1st September 2026</strong>
            </div>

            <p class="main-message">
                Mock Tests will be live <strong>before 1st September 2026</strong>
                and will be available
                <strong>FREE OF COST</strong> for everybody.
            </p>

            <div class="divider"></div>

            <p class="motivation">
                Until then, <strong>work hard</strong> 💪<br>
                <span>Make your parents proud. ❤️</span>
            </p>

            <div class="bottom-text">
                <i class="fa-solid fa-book-open"></i>
                Keep Preparing • Keep Improving • Keep Going
            </div>

        </div>

    </section>

</body>
</html>
